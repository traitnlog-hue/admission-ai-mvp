name: Deploy GACHI public demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gachi_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web demo
        run: >
          flutter build web --release --base-href /admission-ai-mvp/
          --dart-define=AUTH_REDIRECT_URL=https://traitnlog-hue.github.io/admission-ai-mvp/
          --dart-define=AI_CHAT_API_BASE_URL=https://gachi-ai-api-733633562926.asia-northeast3.run.app

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gachi_app/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
